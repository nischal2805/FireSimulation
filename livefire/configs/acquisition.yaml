# Scene acquisition (P1-005; PRD 6.1, 7.2, P1R3, P1R4). Frames -> anchored depth -> median accumulation -> TSDF fusion
# -> surface extraction -> table plane + object clustering -> SceneSnapshot.
acquisition:
  seconds: {value: 5.0, unit: "s", range: [0.5, 30.0], status: artistic}     # acquisition window length per camera
  max_frames: 30            # frames kept per camera inside the window (evenly spaced in time); depth inference per frame is the cost
  min_frames: 3             # fewer usable frames than this per camera raises AcquisitionError
  min_confidence: {value: 0.5, unit: "-", range: [0.0, 1.0], status: artistic}   # accumulated pixels below this agreement fraction are invalid
  agree_tol_rel: {value: 0.02, unit: "-", range: [0.001, 0.2], status: artistic}  # frame agrees with the median within this fraction of depth
  fusion_roi:
    min: [-0.8, -0.6, -0.05]   # m, world frame
    max: [0.8, 0.6, 0.6]       # m, world frame
  voxel_size: {value: 0.01, unit: "m", range: [0.002, 0.05], status: artistic}
  truncation_voxels: 3         # TSDF truncation distance in voxels
  max_depth_m: {value: 6.0, unit: "m", range: [0.5, 20.0], status: artistic}     # measured depth beyond this is not fused
  plane:
    plane_tol_m: {value: 0.01, unit: "m", range: [0.001, 0.05], status: physical_estimate}  # fitted table plane must agree with z = 0 within this
    inlier_m: {value: 0.008, unit: "m", range: [0.001, 0.03], status: artistic}   # points within this of the plane (and facing up) are table
    min_normal_z: 0.8          # plane inliers need |n_z| of the element normal >= this
    ransac_iters: 200
    seed: 1234
  cluster:
    radius_factor: 1.5         # connect points closer than radius_factor * surfel_spacing (same rule as neighbours)
    min_object_area_m2: {value: 0.001, unit: "m^2", range: [0.0001, 0.1], status: artistic}   # smaller components are dropped as noise
  default_object_material: paper     # untagged objects (requires_review=True, HUD) so click-to-ignite works out of the box
  default_object_confidence: 0.3
  min_view_observations: 20    # surfels visible in a camera needed to list it as an observation of an object
  # Segmentation-assisted acquisition (P3-002, P3R2/P3R3; used only when acquire_with_report gets `segmenters`).
  # The number of keyframes per camera is `keyframes` in configs/segment.yaml.
  segment:
    majority_window_px: 3        # odd window of the per-surfel instance majority at the projected pixel
  assoc:
    visibility_tol_m: {value: 0.02, unit: "m", range: [0.002, 0.1], status: artistic}   # surfel Z vs accumulated depth to count as visible
    min_iou: {value: 0.3, unit: "-", range: [0.05, 0.95], status: artistic}   # surfel-set IoU to link instances of different views
    iou_tie: 0.05                # IoUs within this of the best candidate are ties, broken by CIELAB mean colour distance
    min_instance_surfels: 10     # instances with fewer surfels, or sharing fewer surfels across views, are ignored (geometric label kept)
    table_categories: [table]    # an instance with one of these categories belongs to the table object (obj 0)
    table_cover: 0.5             # no table category: largest object holding >= this share of the geometric table surfels ...
    table_overlap: 0.5           # ... and >= this fraction of its own surfels on the geometric table is the table

# Physical/artistic parameters use the form (PRD 8.1):
#   name: {value: <v>, unit: "<u>", range: [lo, hi], status: physical_estimate|artistic}
# Tasks 8, 9 add their parameters here.

# --- surface fire model (P0-007, PRD 8.2/8.3)
T_amb:          {value: 293.15, unit: "K",        range: [250, 320],   status: physical_estimate}
h_c:            {value: 25,     unit: "W/(m^2 K)", range: [1, 200],    status: physical_estimate}
f_feedback:     {value: 0.3,    unit: "-",        range: [0, 1],       status: artistic}
T_pilot:        {value: 900,    unit: "K",        range: [400, 1500],  status: artistic}
ignite_radius:  {value: 0.03,   unit: "m",        range: [0.005, 0.2], status: artistic}
ignition_decay: {value: 0.5,    unit: "1/s",      range: [0, 10],      status: artistic}
T_s_max:        {value: 1500,   unit: "K",        range: [800, 2500],  status: artistic}
T_s_min:        {value: 250,    unit: "K",        range: [200, 300],   status: artistic}
eps_m:          {value: 1.0e-6, unit: "kg/m^2",   range: [0, 1.0e-3],  status: artistic}

# --- gas solver (P0-008, PRD 8.4; T_amb above is shared)
rho_g:      {value: 1.2,   unit: "kg/m^3",    range: [0.1, 2.0],    status: physical_estimate}
c_p:        {value: 1005,  unit: "J/(kg K)",  range: [500, 2000],   status: physical_estimate}
g:          {value: 9.81,  unit: "m/s^2",     range: [0, 20],       status: physical_estimate}
eps_vc:     {value: 0.3,   unit: "-",         range: [0, 2],        status: artistic}
k_cool:     {value: 1.5,   unit: "1/s",       range: [0, 20],       status: artistic}
k_soot:     {value: 0.3,   unit: "1/s",       range: [0, 10],       status: artistic}
T_g_max:    {value: 2000,  unit: "K",         range: [1000, 3000],  status: artistic}
cfl_max:    {value: 3.0,   unit: "-",         range: [0.5, 10],     status: artistic}
n_iters:    {value: 60,    unit: "-",         range: [5, 500],      status: artistic}
wind_speed: {value: 0.0,   unit: "m/s",       range: [0, 5],        status: artistic}
wind_noise: {value: 0.0,   unit: "m/s",       range: [0, 1],        status: artistic}

# --- combustion-intensity field (P0-008b, ADR-0004)
k_flame:    {value: 6.0,   unit: "1/s",       range: [0.5, 50],      status: artistic}

# --- radiation (P2-001, PRD 8.2, ADR-0006)
# rad_mode: 0 = local only (conv + cond), 1 = coarse emission grid, 2 = bounded gather over burning elements
rad_mode:         {value: 2,     unit: "-",   range: [0, 2],          status: artistic}
eps_f:            {value: 0.7,   unit: "-",   range: [0, 1],          status: artistic}
T_rad_flame:      {value: 1100,  unit: "K",   range: [600, 2000],     status: artistic}
rad_R:            {value: 0.30,  unit: "m",   range: [0.02, 1.5],     status: artistic}
rad_r_min:        {value: 0.01,  unit: "m",   range: [0.001, 0.1],    status: artistic}
rad_cell:         {value: 0.05,  unit: "m",   range: [0.01, 0.3],     status: artistic}
rad_max_emitters: {value: 8192,  unit: "-",   range: [16, 1.0e6],     status: artistic}

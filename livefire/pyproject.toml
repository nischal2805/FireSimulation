[project]
name = "livefire"
version = "0.0.1"
description = "LiveFire Previs: live two-camera virtual-fire previs"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "opencv-python",
    "warp-lang",
    "matplotlib",
]

[project.optional-dependencies]
spike = ["taichi"]
# Monocular depth (P1-004, ADR-0005). Optional: core code imports without it. CPU wheels on Linux, CUDA 12.8 on Windows.
depth = ["torch", "transformers", "pillow", "einops", "omegaconf"]
# Segmentation and materials (P3, ADR-0007). Optional: core code and every fast test import without it.
perception = ["torch", "torchvision", "transformers", "pillow"]  # torchvision: required by the SAM 2 image processor

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livefire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests, excluded from `make test`"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "bench"]

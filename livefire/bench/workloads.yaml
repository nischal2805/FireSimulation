# Benchmark workloads (PRD 11.4, Appendix C). Changing anything below requires bumping workload_version.
workload_version: 1
scene: table_v1
# Paper-burning ignition used by every workload: world point [m], radius [m] (same as `make run`).
ignite: {point: [-0.075, 0.0, 0.1], radius: 0.06}
preroll_steps: 120          # sim steps after ignition so that fire exists before anything is timed
warmup: 2                   # launches discarded per workload (the first includes JIT/compile)
repeats: 5                  # >= 5 (PRD 11.4)
# Gas grid sizes G for the simulation stages (sim_step coupled, surface_step, gas_step, projection).
sim_grids: [64, 96, 128]
# Timed samples per repeat for the sim stages, per G (total samples = repeats * value). CPU Warp is single
# threaded, so these shrink with G to bound wall time; the workload itself and the repeat count never change.
sim_samples_per_repeat: {64: 6, 96: 4, 128: 3}
# Render workloads run at this grid on the state of the G=96 simulation (default grid.yaml G).
render_grid: 96
render_volume_scales: [0.5, 1.0]
render_samples_per_repeat: 3
frame_two_views_samples_per_repeat: 3
frame_wall_dt: 0.0333333333   # s, 30 fps display frame fed to sim.run_frame
# --quick: CI-sized run (not a baseline; output goes to bench/results/quick_*.csv).
quick:
  preroll_steps: 5
  warmup: 1
  repeats: 5
  sim_grids: [32]
  sim_samples_per_repeat: {32: 1}
  render_grid: 32
  render_volume_scales: [0.5]
  render_samples_per_repeat: 1
  frame_two_views_samples_per_repeat: 1

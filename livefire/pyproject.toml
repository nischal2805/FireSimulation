[project]
name = "livefire"
version = "0.0.1"
description = "LiveFire Previs: live two-camera virtual-fire previs"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "numpy",
    "scipy",
    "pyyaml",
    "opencv-python-headless",
    "warp-lang",
    "matplotlib",
]

[project.optional-dependencies]
spike = ["taichi"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/livefire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests, excluded from `make test`"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "bench"]
